name: Run Release Please

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    permissions:
      contents: write # for google-github-actions/release-please-action to create release commit
      pull-requests: write # for google-github-actions/release-please-action to create release PR
    runs-on: ubuntu-latest

    # Release-please creates a PR that tracks all changes
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{secrets.RELEASE_PLEASE_ACTION_TOKEN}}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      # these are generated by release-please b/c this is in a manifest repo.
      buf_release_tag: ${{ steps.release.outputs.protobuf--tag_name }}
      json_release_tag: ${{ steps.release.outputs.json--tag_name }}

  push-module:
    needs: release-please
    name: push schema to buf registry
    runs-on: ubuntu-latest
    if: ${{ fromJSON(needs.release-please.outputs.releases_created || false) && needs.release-please.outputs.buf_release_tag }}
    steps:
      # Run `git checkout`
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.buf_release_tag }}
      # Install the `buf` CLI
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
          version: '1.50.0'
      # Push module to the BSR
      - name: bsr-push
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: buf push --tag "${{ needs.release-please.outputs.buf_release_tag }}" protobuf

  create-schema-store-issue:
    needs: release-please
    name: create schema release reminder issue
    runs-on: ubuntu-latest
    if: ${{ fromJSON(needs.release-please.outputs.releases_created || false) && needs.release-please.outputs.json_release_tag }}
    steps:
      # Run `git checkout`
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.json_release_tag }}
      - uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.json_release_tag }}
        with:
          filename: .github/schema-store-issue-template.md
